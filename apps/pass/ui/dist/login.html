<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NextPass 登录</title>
  <link rel="stylesheet" href="/assets/next/app.css">
</head>
<body>
  <div class="app" style="max-width:420px;padding-top:64px">
    <div class="brand" style="justify-content:center;text-align:center">
      <div>
        <h1>NextPass</h1>
        <div class="sub">老师管理口令登录</div>
      </div>
    </div>
    <div class="card">
      <label class="field"><span>管理口令</span>
        <input id="code" type="password" placeholder="config.ini 中的 CodeReadWrite" autofocus>
      </label>
      <button class="btn block" id="loginBtn">进入管理端</button>
      <p class="muted" style="margin:14px 0 0;text-align:center">
        学生请直接打开 <a href="/">首页</a>，无需登录
      </p>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/assets/next/common.js"></script>
  <script>
    (function () {
      var btn = document.getElementById("loginBtn");
      var input = document.getElementById("code");
      async function login() {
        var code = input.value.trim();
        if (!code) {
          NP.toast("请输入管理口令");
          return;
        }
        try {
          var data = await NP.api("/pass/login?code=" + encodeURIComponent(code), { noRedirect: true });
          // data like "rw:TOKEN"
          var parts = String(data).split(":");
          var auth = parts[0];
          var token = parts.slice(1).join(":");
          if (auth !== "rw") {
            NP.toast("请使用读写管理口令");
            return;
          }
          NP.setAuth(auth, token);
          location.href = "/admin";
        } catch (e) {
          NP.toast(e.message || "登录失败");
        }
      }
      btn.onclick = login;
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") login();
      });
      if (NP.getToken() && NP.getAuth() === "rw") {
        location.href = "/admin";
      }
    })();
  </script>
</body>
</html>
