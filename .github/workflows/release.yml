name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v2.1.0)"
        required: true
        default: "v2.1.0"
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: "1"
            artifact: nextpass-win
            binary: nextpass.exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            artifact: nextpass-linux
            binary: nextpass
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: "0"
            artifact: nextpass-mac
            binary: nextpass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install MinGW (Windows CGO)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress

      - name: Hide Windows .syso on non-Windows
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          if [ -f main/main.syso ]; then mv main/main.syso main/main.syso.bak; fi

      - name: Build
        working-directory: main
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p "../dist/${{ matrix.artifact }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            for d in \
              "/c/ProgramData/mingw64/mingw64/bin" \
              "/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin" \
              "/c/tools/mingw64/bin" \
              "/c/mingw64/bin"
            do
              [ -d "$d" ] && export PATH="$d:$PATH"
            done
            gcc --version
          fi
          go build -trimpath -ldflags="-s -w" -o "../dist/${{ matrix.artifact }}/${{ matrix.binary }}" .
          ls -lh "../dist/${{ matrix.artifact }}/${{ matrix.binary }}"

      - name: Stage package files
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/${{ matrix.artifact }}"
          printf '%s\n' \
            '[gateway]' \
            'ListenAddr = ":8000"' \
            'Domain = ""' \
            '' \
            '[pass]' \
            'Path = "files"' \
            'CodeReadWrite = "admin"' \
            'CodeReadOnly = ""' \
            'LockUploadDir = ""' \
            > "$PKG/config.ini"
          printf '%s\n' \
            '# NextPass' \
            '' \
            '1. 运行 nextpass / nextpass.exe' \
            '2. 学生打开 http://老师IP:8000/' \
            '3. 老师打开 http://老师IP:8000/admin （默认口令 admin）' \
            > "$PKG/readme.md"
          if [ "${{ matrix.goos }}" != "windows" ]; then
            chmod +x "$PKG/${{ matrix.binary }}"
          fi
          if [ "${{ matrix.goos }}" = "windows" ] && [ -f "zdoc/b0pass-win/zlib1.dll" ]; then
            cp "zdoc/b0pass-win/zlib1.dll" "$PKG/zlib1.dll"
          fi

      - name: Zip artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a -tzip "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          else
            zip -r "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          case "$V" in
            v*) ;;
            *) V="v$V" ;;
          esac
          echo "tag=$V" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        shell: bash
        run: |
          mkdir -p out
          find release-assets -type f -name '*.zip' -exec cp {} out/ \;
          ls -lah out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: NextPass ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            NextPass 局域网作业助手（基于 b0pass 改造）

            ## 下载
            - **Windows**: `nextpass-win.zip`
            - **Linux**: `nextpass-linux.zip`
            - **macOS**: `nextpass-mac.zip`

            ## 使用
            1. 解压运行
            2. **学生**：`http://老师IP:8000/`
            3. **老师**：`http://老师IP:8000/admin`（默认口令 `admin`，见 config.ini）
          files: |
            out/*.zip
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
