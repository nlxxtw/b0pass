name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v2.0.6)"
        required: true
        default: "v2.0.6"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: "1"
            artifact: b0pass-win
            binary: b0pass.exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            artifact: b0pass-linux
            binary: b0pass
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: "0"
            artifact: b0pass-mac
            binary: b0pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install MinGW (Windows CGO)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          Get-ChildItem "C:\ProgramData\mingw64","C:\tools\mingw64","C:\mingw64" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "found: $($_.FullName)" }

      - name: Hide Windows .syso on non-Windows
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          if [ -f main/main.syso ]; then
            mv main/main.syso main/main.syso.bak
          fi

      - name: Build
        working-directory: main
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p "../dist/${{ matrix.artifact }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            for d in \
              "/c/ProgramData/mingw64/mingw64/bin" \
              "/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin" \
              "/c/tools/mingw64/bin" \
              "/c/mingw64/bin"
            do
              [ -d "$d" ] && export PATH="$d:$PATH"
            done
            echo "PATH=$PATH"
            gcc --version
          fi
          go build -trimpath -ldflags="-s -w" -o "../dist/${{ matrix.artifact }}/${{ matrix.binary }}" .

      - name: Stage package files
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/${{ matrix.artifact }}"
          mkdir -p "$PKG"

          printf '%s\n' \
            '[gateway]' \
            'ListenAddr = ":8888"' \
            'Domain = ""' \
            '' \
            '[pass]' \
            'Path = "files"' \
            'CodeReadOnly = ""' \
            'CodeReadWrite = ""' \
            'LockUploadDir = ""' \
            > "$PKG/config.ini"

          if [ -f "zdoc/${{ matrix.artifact }}/readme.md" ]; then
            cp "zdoc/${{ matrix.artifact }}/readme.md" "$PKG/readme.md"
          else
            printf '# B0Pass\n\nRun the binary, then open the printed URL.\n' > "$PKG/readme.md"
          fi

          if [ "${{ matrix.goos }}" = "windows" ] && [ -f "zdoc/b0pass-win/zlib1.dll" ]; then
            cp "zdoc/b0pass-win/zlib1.dll" "$PKG/zlib1.dll"
          fi

          if [ "${{ matrix.goos }}" = "linux" ] && [ -f "zdoc/b0pass-linux/start.sh" ]; then
            cp "zdoc/b0pass-linux/start.sh" "$PKG/start.sh"
            chmod +x "$PKG/start.sh" "$PKG/${{ matrix.binary }}"
          fi

          if [ "${{ matrix.goos }}" = "darwin" ]; then
            chmod +x "$PKG/${{ matrix.binary }}"
          fi

      - name: Zip artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a -tzip "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          else
            zip -r "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          case "$V" in
            v*) ;;
            *) V="v$V" ;;
          esac
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $V"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find release-assets -type f -name '*.zip' -exec cp {} out/ \;
          ls -lah out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 百灵快传（B0Pass） ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            基于 `master` 最新源码自动编译（含 2.0.4–2.0.6 未发版改动）。

            ## 下载
            - **Windows**: `b0pass-win.zip`
            - **Linux**: `b0pass-linux.zip`
            - **macOS**: `b0pass-mac.zip`

            ## 使用
            解压后运行可执行文件，浏览器打开终端提示的局域网地址即可。
            可通过同目录 `config.ini` 修改端口、共享目录与读写口令。

            > 本 Release 由 GitHub Actions 在 fork 仓库自动构建，非 upstream 官方包。
          files: |
            out/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
